name: Rejillas de pronóstico

# Descarga y codifica el run más reciente de GFS y de ECMWF y los publica en la rama `grids` (T-33, T-31).
# - ECMWF completa sus 72 h unas 7,5 h después del run (más tarde que GFS); el reintento suele alcanzarlo.
# - GFS corre a las 00/06/12/18 UTC y NOMADS completa los 72 h unas 5 h después (medido 2026-11-13):
#   se intenta a las +4 h 45 min y se reintenta 1,5 h más tarde. Si el run ya está publicado no hace nada.
# - La rama `grids` tiene UN solo commit que se reemplaza (sin historial que crezca) con los 2 últimos runs.
# - Si algo falla, el workflow queda en rojo y la rama conserva la versión anterior (nunca se publica a medias).
# - El deploy (deploy.yml) copia esta rama a /data del sitio.
# - Focos de calor NASA FIRMS (T-52) en cada corrida, con el secreto FIRMS_MAP_KEY (gratuito; sin él se omiten).

on:
  schedule:
    - cron: '45 4,10,16,22 * * *'
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Traer lo ya publicado (rama grids, si existe)
        run: |
          git clone --quiet --depth 1 --branch grids --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" publish || mkdir -p publish
          rm -rf publish/.git

      - name: Instalar pipeline
        working-directory: pipeline
        run: uv sync --locked

      - name: Actualizar rejillas (GFS y ECMWF)
        id: update
        working-directory: pipeline
        # Si un modelo falla, el otro se publica igual; el paso queda en rojo al final (ver "Resultado").
        continue-on-error: true
        run: uv run python -m windcloud_pipeline.update --modelo todos --salida ../publish/data --trabajo ../work

      - name: Focos de calor (NASA FIRMS)
        id: fires
        working-directory: pipeline
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::warning::Sin secreto FIRMS_MAP_KEY: no se actualizan los focos de calor."
            exit 0
          fi
          uv run python -m windcloud_pipeline.fires --salida ../publish/data
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Publicar en la rama grids (commit único)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=""
          for m in gfs ecmwf; do
            f="publish/data/$m/status.json"
            [ -f "$f" ] && [ "$(jq -r .result "$f")" = "actualizado" ] && changed="$changed $m"
          done
          [ "${{ steps.fires.outputs.updated }}" = "true" ] && changed="$changed focos"
          if [ -z "$changed" ]; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          run="$(for m in gfs ecmwf; do [ -f publish/data/$m/latest.json ] && echo "$m $(jq -r .run publish/data/$m/latest.json)"; done | paste -sd ',' -)"
          cd publish
          git init --quiet -b grids
          git add -A
          git -c user.name="windcloud-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Rejillas:${changed} (${run})"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" grids
          echo "Publicado run ${run} ($(du -sh data | cut -f1))."

      - name: Resultado
        if: steps.update.outcome == 'failure' || steps.fires.outcome == 'failure'
        run: |
          echo "::error::Falló la actualización de un modelo o de los focos de calor (ver los pasos)."
          exit 1
