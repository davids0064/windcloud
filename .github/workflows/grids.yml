name: Rejillas GFS

# Descarga y codifica el run de GFS más reciente y lo publica en la rama `grids` (T-33, RNF-5).
# - GFS corre a las 00/06/12/18 UTC y NOMADS completa los 72 h unas 5 h después (medido 2026-11-13):
#   se intenta a las +4 h 45 min y se reintenta 1,5 h más tarde. Si el run ya está publicado no hace nada.
# - La rama `grids` tiene UN solo commit que se reemplaza (sin historial que crezca) con los 2 últimos runs.
# - Si algo falla, el workflow queda en rojo y la rama conserva la versión anterior (nunca se publica a medias).
# - El deploy (deploy.yml) copia esta rama a /data del sitio.

on:
  schedule:
    - cron: '45 4,10,16,22 * * *'
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Traer lo ya publicado (rama grids, si existe)
        run: |
          git clone --quiet --depth 1 --branch grids --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" publish || mkdir -p publish
          rm -rf publish/.git

      - name: Instalar pipeline
        working-directory: pipeline
        run: uv sync --locked

      - name: Actualizar rejillas
        working-directory: pipeline
        run: uv run python -m windcloud_pipeline.update --salida ../publish/data --trabajo ../work

      - name: Publicar en la rama grids (commit único)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(jq -r .result publish/data/gfs/status.json)
          if [ "$result" != "actualizado" ]; then
            echo "Sin cambios que publicar ($result)."
            exit 0
          fi
          run=$(jq -r .run publish/data/gfs/latest.json)
          cd publish
          git init --quiet -b grids
          git add -A
          git -c user.name="windcloud-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Rejillas GFS run ${run}"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" grids
          echo "Publicado run ${run} ($(du -sh data | cut -f1))."
