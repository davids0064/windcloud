name: Deploy web

# Publica web/ en Cloudflare Pages (plan gratuito). → RNF-1, T-04
# Por ahora solo manual (Actions → Deploy web → Run workflow): el desarrollo se hace en local
# hasta decidir publicar. Para desplegar en cada push, volver a añadir el disparador `push`.
# Requiere los secretos del repositorio:
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta de Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

env:
  PAGES_PROJECT: windcloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Rejillas de pronóstico publicadas por grids.yml (rama `grids`) → /data del sitio.
      - name: Incluir rejillas de pronóstico
        working-directory: .
        run: |
          if git clone --quiet --depth 1 --branch grids --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" grids-data; then
            cp -r grids-data/data web/dist/data
            echo "Rejillas: $(jq -r .run web/dist/data/gfs/latest.json)"
          else
            echo "::warning::Aún no hay rama grids: el sitio mostrará «Sin datos de pronóstico»."
          fi

      # Crea el proyecto de Pages la primera vez; si ya existe, el error se ignora.
      - name: Asegurar proyecto en Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PAGES_PROJECT }} --production-branch=main

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
